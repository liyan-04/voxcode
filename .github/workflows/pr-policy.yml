name: PR Policy

on:
  push:
    branches: [main, master, codex/mvp]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  reject-direct-push:
    if: github.event_name == 'push'
    name: Reject direct push to protected branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify the commit came from a merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const base = context.ref.replace('refs/heads/', '');
            const merged = prs.some(pr => pr.merged_at && pr.base.ref === base);
            if (!merged) {
              core.setFailed(`Direct push to protected branch ${base} is prohibited; submit a codex/* branch through a pull request.`);
            } else {
              core.info(`Protected branch update came from merged PR #${prs.find(pr => pr.merged_at && pr.base.ref === base).number}.`);
            }
  policy:
    if: github.event_name == 'pull_request'
    name: Commit and PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:policy
      - name: Read current PR metadata as data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const params = { ...context.repo, pull_number: context.issue.number };
            const { data: pr } = await github.rest.pulls.get(params);
            const commits = await github.paginate(github.rest.pulls.listCommits, { ...params, per_page: 100 });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'voxcode-pr-policy.json'), JSON.stringify({
              title: pr.title,
              body: pr.body,
              headRef: pr.head.ref,
              commitCount: pr.commits,
              commits: commits.map(commit => ({ sha: commit.sha, message: commit.commit.message }))
            }));
      - name: Check title, body, branch and every commit subject
        run: node scripts/check-pr-policy.mjs --pr-file "$RUNNER_TEMP/voxcode-pr-policy.json"
