name: Verify VoxCode

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix packages/voice
      - run: npm ci --ignore-scripts --prefix apps/relay
      - name: Test Node services and collect complete source coverage
        run: npm run test:coverage:node
      - name: Check out the PR coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage/base-node
          persist-credentials: false
      - name: Install baseline dependencies without lifecycle scripts
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage/base-node/package-lock.json ]; then
            npm ci --ignore-scripts --prefix coverage/base-node
          fi
          npm ci --ignore-scripts --prefix coverage/base-node/packages/voice
          npm ci --ignore-scripts --prefix coverage/base-node/apps/relay
      - name: Collect baseline with the same Node coverage tool
        if: github.event_name == 'pull_request'
        run: node scripts/coverage.mjs collect-node --root coverage/base-node --output coverage/node-base
      - name: Enforce Node changed-code thresholds and no baseline regression
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/coverage.mjs check --language node --root . --report coverage/node/lcov.info --base-root coverage/base-node --baseline coverage/node-base/lcov.info --base "$COVERAGE_BASE" --head "$COVERAGE_HEAD" --output coverage/node-gate
      - name: Upload Node coverage evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          retention-days: 7
          path: |
            coverage/node/lcov.info
            coverage/node/coverage-summary.json
            coverage/node-base/lcov.info
            coverage/node-base/coverage-summary.json
            coverage/node-gate/gate.json

  native-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Swift core with the full Xcode toolchain
        run: node scripts/coverage.mjs collect-swift --root . --output coverage/swift
      - name: Check out the PR Swift coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage/base-swift
          persist-credentials: false
      - name: Collect baseline with the same Swift toolchain
        if: github.event_name == 'pull_request'
        run: node scripts/coverage.mjs collect-swift --root coverage/base-swift --output coverage/swift-base
      - name: Enforce Swift core changed lines and no baseline regression
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/coverage.mjs check --language swift --root . --report coverage/swift/lcov.info --base-root coverage/base-swift --baseline coverage/swift-base/lcov.info --base "$COVERAGE_BASE" --head "$COVERAGE_HEAD" --output coverage/swift-gate
      - name: Upload Swift core coverage evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-coverage
          retention-days: 7
          path: |
            coverage/swift/lcov.info
            coverage/swift-base/lcov.info
            coverage/swift-gate/gate.json
      - name: Install verified XcodeGen 2.44.1 release
        run: |
          curl --fail --location --retry 2 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -exec chmod +x {} \;
      - name: Generate and build unsigned iOS simulator app
        working-directory: apps/ios
        run: |
          XCODEGEN_BIN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -n 1)
          "$XCODEGEN_BIN" generate --spec project.yml
          xcodebuild -project VoxCode.xcodeproj -scheme VoxCode -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/voxcode-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Run native recorder and client regressions on an iPhone simulator
        working-directory: apps/ios
        run: |
          VOXCODE_SIMULATOR_ID=$(xcrun simctl list devices available --json | node -e 'let input="";process.stdin.on("data",part=>input+=part);process.stdin.on("end",()=>{const device=Object.values(JSON.parse(input).devices).flat().find(value=>value.isAvailable&&value.name.startsWith("iPhone"));if(!device)process.exit(1);process.stdout.write(device.udid);});')
          xcodebuild test -project VoxCode.xcodeproj -scheme VoxCode -configuration Debug -destination "platform=iOS Simulator,id=$VOXCODE_SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/voxcode-derived" -resultBundlePath "$RUNNER_TEMP/voxcode-native-tests.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Upload unsigned simulator build and native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-simulator
          retention-days: 7
          path: |
            ${{ runner.temp }}/voxcode-derived/Build/Products/Debug-iphonesimulator/VoxCode.app
            ${{ runner.temp }}/voxcode-native-tests.xcresult
