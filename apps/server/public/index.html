<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoxCode</title><main><h1>VoxCode</h1><p>语音控制的 Code Agent</p><button id="login">登录</button><form id="task"><input name="prompt" placeholder="输入任务" required><button>提交任务</button></form><pre id="out"></pre></main><script>const out=document.querySelector('#out');document.querySelector('#login').onclick=async()=>{await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:prompt('登录密码')})});out.textContent='已登录'};document.querySelector('#task').onsubmit=async e=>{e.preventDefault();const prompt=new FormData(e.target).get('prompt');const r=await fetch('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt})});out.textContent=JSON.stringify(await r.json(),null,2)};</script>
